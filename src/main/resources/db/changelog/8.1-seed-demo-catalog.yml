              WITH p AS (
                  INSERT INTO products (id, name, name_az, description, description_az, category, room, room_type, part_type,
                                        rating, is_popular, is_discount, discount_percent, status, sort_order, deleted, created_at, updated_at)
                  VALUES (2, 'Royal Navy Velur Fonluq', 'Royal Navy Velur Fonluq', 'Yüksək keyfiyyətli velur materialdan hazırlanmış blackout fonluq. Tam qaranlıq təmin edir.', 'Yüksək keyfiyyətli velur materialdan hazırlanmış blackout fonluq. Tam qaranlıq təmin edir.', 'Kornizlər', 'Yataq otağı', 'Yataq otağı', 'Standart',
                          4.8, true, true, 29, 'Endirimli', 20, false, NOW(), NOW())
                  RETURNING id
