                  INSERT INTO product_colors (name, color_hex, image_url, product_id)
                  SELECT v.name, v.hex, v.url, p.id FROM p,
                      (VALUES ('Tünd Göy', '#000080', 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=900&q=75'),
                       ('Antrasit', '#383E42', 'https://images.unsplash.com/photo-1484101403633-562f891dc89a?auto=format&fit=crop&w=900&q=75'),
                       ('Zümrüd', '#004B49', 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?auto=format&fit=crop&w=900&q=75'),
                       ('Bordo', '#800000', 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=900&q=75'),
                       ('Qara', '#000000', 'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=900&q=75')) AS v(name, hex, url)
              )
              INSERT INTO product_sizes (size_value, price, old_price, product_id)
              SELECT v.size, v.price, v.old_price, p.id FROM p,
                  (VALUES ('150x270', 85, 120),
                       ('200x270', 110, 150)) AS v(size, price, old_price);

