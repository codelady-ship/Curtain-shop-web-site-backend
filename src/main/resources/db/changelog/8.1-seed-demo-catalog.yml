# Demo catalog for an empty database (e.g. a fresh Neon / Render PostgreSQL).
# Same 14 products as the frontend's GitHub Pages demo (src/store/productData.json),
# with images on images.unsplash.com that were checked to return HTTP 200.
# Runs only when the products table is empty; otherwise it is marked as ran and never
# touches real data. No admin users or passwords are seeded.
databaseChangeLog:
  - changeSet:
      id: 8.1-seed-demo-catalog
      author: antiga
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM products
      comment: Seed the demo catalog (14 products with colours and sizes) into an empty products table.
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            stripComments: true
            sql: |
              -- 1. Venesiya Eksklüziv İtalyan Tülü
              WITH p AS (
                  INSERT INTO products (id, name, name_az, description, description_az, category, room, room_type, part_type,
                                        rating, is_popular, is_discount, discount_percent, status, sort_order, deleted, created_at, updated_at)
                  VALUES (1, 'Venesiya Eksklüziv İtalyan Tülü', 'Venesiya Eksklüziv İtalyan Tülü', 'Klassik İtalyan zərifliyi ilə toxunmuş premium tül. Otağınıza həm işıq, həm də məxfilik qatır.', 'Klassik İtalyan zərifliyi ilə toxunmuş premium tül. Otağınıza həm işıq, həm də məxfilik qatır.', 'Tüllər', 'Qonaq otağı', 'Qonaq otağı', 'Standart',
                          5, true, true, 31, 'Endirimli', 10, false, NOW(), NOW())
                  RETURNING id
              ), c AS (
                  INSERT INTO product_colors (name, color_hex, image_url, product_id)
                  SELECT v.name, v.hex, v.url, p.id FROM p,
                      (VALUES ('Krem', '#FFFDD0', 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=900&q=75'),
                       ('Ağ', '#FFFFFF', 'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=900&q=75'),
                       ('Bej', '#F5F5DC', 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=75'),
                       ('Gümüşü', '#C0C0C0', 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=900&q=75'),
                       ('Qızılı', '#D4AF37', 'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=900&q=75')) AS v(name, hex, url)
              )
              INSERT INTO product_sizes (size_value, price, old_price, product_id)
              SELECT v.size, v.price, v.old_price, p.id FROM p,
                  (VALUES ('200x250', 45, 65),
                       ('250x250', 55, 75),
                       ('300x250', 70, 95)) AS v(size, price, old_price);

