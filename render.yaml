# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Self-contained: it creates the free PostgreSQL database and the free Docker web service,
# wires the database credentials in automatically and generates the secrets.
# Nothing has to be typed in during Apply.
#
# Note: Render's free PostgreSQL expires 30 days after creation, and a workspace can only
# have one free PostgreSQL at a time. For a permanent database, move to Neon (README:
# "Move the database to Neon").
databases:
  - name: curtain-shop-db
    plan: free
    region: frankfurt
    databaseName: properde
    user: properde
    postgresMajorVersion: "16"
    ipAllowList: []   # only reachable from Render services in this workspace

services:
  - type: web
    name: curtain-shop-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # --- Database: filled from curtain-shop-db. application.yml builds
      #     jdbc:postgresql://DB_HOST:DB_PORT/DB_NAME when SPRING_DATASOURCE_URL is not set.
      #     (To use Neon instead, set SPRING_DATASOURCE_URL/USERNAME/PASSWORD in the dashboard;
      #     they take precedence over these.) ---
      - key: DB_HOST
        fromDatabase:
          name: curtain-shop-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: curtain-shop-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: curtain-shop-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: curtain-shop-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: curtain-shop-db
          property: password
      # Small pool: Render free has 512 MB RAM and the free database has limited connections.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"

      # --- Admin JWT signing key: a random value generated once by Render. ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "86400"

      # --- First-login admin account (created on the first /api/admin/auth/login).
      #     ADMIN_PASSWORD is generated by Render (random base64, about 44 characters).
      #     Read it in Dashboard -> curtain-shop-api -> Environment, log in once, then change it
      #     in the admin panel (Settings -> change password). ---
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

      # --- Frontends allowed to call the API (comma-separated https origins, no paths) ---
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://codelady-ship.github.io,https://perde.az,https://www.perde.az

      # Smaller Tomcat thread pool for 512 MB RAM.
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "20"

      # No public Swagger UI / OpenAPI docs in production.
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "false"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "false"

      # --- Optional, NOT in the Blueprint so Apply needs no input. Add them later in
      #     Dashboard -> curtain-shop-api -> Environment only if you want password-reset codes:
      #       SMTP (email):   MAIL_HOST, MAIL_PORT (587), MAIL_USERNAME, MAIL_PASSWORD, APP_MAIL_FROM
      #       WhatsApp Cloud: WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID
      #     Without them the app runs normally; only password-reset code delivery is unavailable. ---
