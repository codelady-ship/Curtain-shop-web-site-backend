# Render Blueprint matching the live setup: the free Docker web service "curtain-shop-api"
# with a free Neon PostgreSQL (Frankfurt). Neon does not expire, unlike Render's free PostgreSQL.
# Dashboard -> New -> Blueprint -> pick this repo -> Apply. Apply asks for the three
# SPRING_DATASOURCE_* values from Neon (Connect, pooling off); everything else is preset or generated.
# The live service was created by hand with the same variables, so this file documents it.
services:
  - type: web
    name: curtain-shop-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # --- Database: Neon (Neon dashboard -> Connect, connection pooling off). Never commit these.
      #     SPRING_DATASOURCE_URL = jdbc:postgresql://<host>/<database>?sslmode=require ---
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Small pool: Render free has 512 MB RAM and Neon free has limited connections.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"

      # --- Admin JWT signing key: a random value generated once by Render. ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "86400"

      # --- First-login admin account (created on the first /api/admin/auth/login).
      #     ADMIN_PASSWORD is generated by Render (random base64, about 44 characters).
      #     Read it in Dashboard -> curtain-shop-api -> Environment, log in once, then change it
      #     in the admin panel (Settings -> change password). ---
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

      # --- Public read-only demo admin for the portfolio (demo / demo1234, seeded by Liquibase 9.1).
      #     Reads only: writes answer 403, customer leads are masked. "false" turns the demo login off. ---
      - key: DEMO_ADMIN_ENABLED
        value: "true"

      # --- Frontends allowed to call the API (comma-separated https origins, no paths) ---
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://codelady-ship.github.io,https://perde.az,https://www.perde.az

      # Smaller Tomcat thread pool for 512 MB RAM.
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "20"

      # No public Swagger UI / OpenAPI docs in production.
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "false"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "false"

      # --- Optional, NOT in the Blueprint so Apply needs no input. Add them later in
      #     Dashboard -> curtain-shop-api -> Environment only if you want password-reset codes:
      #       SMTP (email):   MAIL_HOST, MAIL_PORT (587), MAIL_USERNAME, MAIL_PASSWORD, APP_MAIL_FROM
      #       WhatsApp Cloud: WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID
      #     Without them the app runs normally; only password-reset code delivery is unavailable. ---
